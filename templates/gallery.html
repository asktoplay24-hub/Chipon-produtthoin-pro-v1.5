<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังรูป | CHIPON Production</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        .gallery {
            padding: 100px 5% 50px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-grid {
            display: grid !important;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)) !important;
            gap: 20px !important;
        }

        .gallery-grid img {
            width: 100% !important;
            height: 240px !important;
            object-fit: cover !important;
            border-radius: 12px !important;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .gallery-grid img:hover {
            transform: scale(1.03);
        }

        /* บังคับสไตล์ Lightbox Popup */
        #lightbox {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100vh !important;
            background: rgba(0, 0, 0, 0.9) !important;
            display: none; /* ซ่อนตั้งต้น */
            justify-content: center !important;
            align-items: center !important;
            z-index: 99999 !important;
        }

        #lightbox img {
            max-width: 85% !important;
            max-height: 85% !important;
            border-radius: 12px !important;
            object-fit: contain !important;
        }

        #closeBtn {
            position: absolute !important;
            top: 20px !important;
            right: 35px !important;
            font-size: 45px !important;
            color: #fff !important;
            cursor: pointer !important;
            user-select: none;
        }

        #prevBtn, #nextBtn {
            position: absolute !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            font-size: 40px !important;
            background: none !important;
            border: none !important;
            color: #fff !important;
            cursor: pointer !important;
            padding: 10px !important;
            user-select: none;
        }

        #prevBtn { left: 20px !important; }
        #nextBtn { right: 20px !important; }
        /* ตกแต่งปุ่มดาวน์โหลดรูปภาพใน Lightbox */
     #downloadBtn {
         position: absolute;
         bottom: 25px;
         background: #00bfff;
         color: #fff;
         padding: 10px 22px;
         border-radius: 30px;
         text-decoration: none;
         font-size: 16px;
         font-weight: 600;
         transition: 0.3s;
         box-shadow: 0 4px 15px rgba(0, 191, 255, 0.4);
         z-index: 1000000 !important;
     }     
     
     #downloadBtn:hover {
         background: #0088cc;
         transform: translateY(-3px);
     }
    </style>
</head>
<body>

<header style="padding: 20px 50px; display: flex; justify-content: space-between; background: #111;">
    <h1 style="margin:0; font-size: 24px;">คลังรูป</h1>
    <a href="/" style="color: #00bfff; text-decoration: none;">← หน้าหลัก</a>
</header>

<section class="gallery">
    <div class="gallery-grid">
            <img class="gallery-img" src="{{ url_for('static', filename='images/photo1.jpg') }}" alt="Photo 1">
            <img class="gallery-img" src="{{ url_for('static', filename='images/photo2.jpg') }}" alt="Photo 2">
            <img class="gallery-img" src="{{ url_for('static', filename='images/photo3.jpg') }}" alt="Photo 3">
            <img class="gallery-img" src="{{ url_for('static', filename='images/photo4.jpg') }}" alt="Photo 4">
            <img class="gallery-img" src="{{ url_for('static', filename='images/work1.jpg') }}" alt="Work 1">
        </div>
</section>

<!-- Lightbox Modal -->
<div id="lightbox">
    <span id="closeBtn">&times;</span>
    <button id="prevBtn">&#10094;</button>
    <img id="lightbox-img" src="" alt="Enlarged Image">
    <button id="nextBtn">&#10095;</button>

    <!-- ➕ เพิ่มปุ่มดาวน์โหลดรูปตรงนี้ -->
    <a id="downloadBtn" href="" download class="download-icon" title="ดาวน์โหลดรูปนี้">
        ⬇ ดาวน์โหลดรูป
    </a>
</div>

<script src="{{ url_for('static', filename='js/gallery.js') }}"></script>
</body>
</html>
